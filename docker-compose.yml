# docker-compose.yml — local development stack
# Usage: docker compose up --build

services:
  # ── RAG API Server ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      RAG_USE_DUMMY_LLM: "true"        # Set to "false" when vLLM is running
      RAG_LLM_BASE_URL: "http://vllm:8001/v1"
      RAG_RERANKER_ENABLED: "false"    # Disable for fast local dev
      RAG_LOG_LEVEL: "debug"
      RAG_API_KEY: "dev-key-change-me"
      RAG_VECTOR_BACKEND: "faiss"
    volumes:
      - ./src:/app/src:ro
      - faiss-data:/data/faiss_index
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/healthz/live'); exit(0 if r.status_code==200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3

  # ── vLLM (optional — requires GPU) ─────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8001"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --max-model-len 8192
      --gpu-memory-utilization 0.85
      --port 8001
      --dtype auto
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu   # Only start with: docker compose --profile gpu up

  # ── Qdrant (optional persistent vector store) ──────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
    profiles:
      - qdrant

volumes:
  faiss-data:
  qdrant-data:
