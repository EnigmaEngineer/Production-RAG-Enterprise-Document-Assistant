apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: rag-enterprise
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
        app.kubernetes.io/part-of: rag-enterprise
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: rag-api
          image: rag-enterprise/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secrets

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          # Readiness: pipeline fully loaded (embeddings, indexes)
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          # Liveness: process alive
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Startup: extra time for model downloads on first run
          startupProbe:
            httpGet:
              path: /healthz/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30  # up to 5 minutes for first startup

          volumeMounts:
            - name: faiss-data
              mountPath: /data/faiss_index

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]  # drain connections

      volumes:
        - name: faiss-data
          emptyDir:
            sizeLimit: 2Gi
