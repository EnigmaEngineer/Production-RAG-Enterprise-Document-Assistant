---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-service
  namespace: rag-system
  labels:
    app.kubernetes.io/name: rag-api
    app.kubernetes.io/part-of: rag-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: rag-system
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/part-of: rag-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vllm
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
