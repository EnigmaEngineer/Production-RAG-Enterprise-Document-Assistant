---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-api
  labels:
    {{- include "rag.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: {{ .Values.api.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "rag.api.selectorLabels" . | nindent 4 }}

{{- if .Values.vllm.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-vllm
  labels:
    {{- include "rag.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.vllm.service.port }}
      targetPort: {{ .Values.vllm.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "rag.vllm.selectorLabels" . | nindent 4 }}
{{- end }}

{{- if .Values.qdrant.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag.fullname" . }}-qdrant
  labels:
    {{- include "rag.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.qdrant.service.port }}
      targetPort: {{ .Values.qdrant.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "rag.qdrant.selectorLabels" . | nindent 4 }}
{{- end }}
