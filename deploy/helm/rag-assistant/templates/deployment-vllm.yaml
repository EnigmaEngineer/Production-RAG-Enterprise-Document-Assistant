{{- if .Values.vllm.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag.fullname" . }}-vllm
  labels:
    {{- include "rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: llm
spec:
  replicas: {{ .Values.vllm.replicaCount }}
  selector:
    matchLabels:
      {{- include "rag.vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rag.vllm.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: vllm
          image: "{{ .Values.vllm.image.repository }}:{{ .Values.vllm.image.tag }}"
          args:
            - "--model"
            - {{ .Values.vllm.model | quote }}
            - "--max-model-len"
            - {{ .Values.vllm.maxModelLen | quote }}
            - "--gpu-memory-utilization"
            - {{ .Values.vllm.gpuMemoryUtilization | quote }}
            - "--port"
            - {{ .Values.vllm.service.port | quote }}
            - "--trust-remote-code"
          ports:
            - containerPort: {{ .Values.vllm.service.port }}
              name: http
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rag.fullname" . }}-secrets
                  key: HF_TOKEN
                  optional: true
          resources:
            {{- toYaml .Values.vllm.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vllm.service.port }}
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.vllm.service.port }}
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
      {{- with .Values.vllm.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.vllm.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
