[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rag-enterprise"
version = "1.0.0"
description = "Production RAG Enterprise Document Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "openai>=1.50.0",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.8.0",
    "qdrant-client>=1.12.0",
    "numpy>=1.26.0",
    "nltk>=3.9.0",
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pybreaker>=1.2.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "PyPDF2>=3.0.0",
    "tiktoken>=0.8.0",
    "orjson>=3.10.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
eval = [
    "pandas>=2.2.0",
    "tabulate>=0.9.0",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.5.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
gpu = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
]
