# .github/workflows/nightly-eval.yml
# Runs the full evaluation matrix nightly (or on manual dispatch).
# This is heavier than CI — it tests all 5 chunking configs and runs
# the concurrent load test.

name: Nightly — Full Evaluation Matrix

on:
  schedule:
    - cron: "0 4 * * *"  # 4 AM UTC daily
  workflow_dispatch:       # manual trigger from Actions tab

env:
  PYTHON_VERSION: "3.12"
  RAG_USE_DUMMY_LLM: "true"
  RAG_RERANKER_ENABLED: "false"
  RAG_LOG_LEVEL: "error"

jobs:
  full-eval:
    name: Full Config Matrix + Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-base-en-v1.5
          restore-keys: hf-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full evaluation matrix
        env:
          # Reranker runs on CPU in CI — allow higher latency threshold
          GATE_P95_MS: "15000"
        run: |
          python evaluation/backtest.py \
            --config config.yaml \
            --generate-synthetic \
            --load-test \
            --concurrency 2 \
            --load-iterations 24 \
            --output evaluation/results-nightly.json

      - name: Upload nightly results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-${{ github.run_number }}
          path: evaluation/results-nightly.json
          retention-days: 90
